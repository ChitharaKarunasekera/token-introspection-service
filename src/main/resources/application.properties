# Server
server.port=8080

# Keycloak / IdP configuration
app.idp.jwks-uri=http://localhost:8180/realms/token-demo/protocol/openid-connect/certs
app.idp.issuer=http://localhost:8180/realms/token-demo
app.idp.token-endpoint=http://localhost:8180/realms/token-demo/protocol/openid-connect/token

app.client.id=introspection-service
app.client.secret=${KEYCLOAK_CLIENT_SECRET:change-me}

# JWKS cache settings
app.jwks.cache-ttl-minutes=60
app.jwks.cache-max-size=10

# Allowed algorithms — never accept "none"
app.security.allowed-algorithms=RS256,RS384,RS512

# Actuator — expose health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always